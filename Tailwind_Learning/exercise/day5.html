<html lang="en">

      <h1 id="ubahJudul">Belajar Javascript</h1>

    </div>

    <!--Dark Mode-->

    <!----------------------------------------------------->

    <!--Tambah Pesan-->

      <button id="btnTambahPesan">Tambah Pesan</button>
      <button id="btnHapusTerakhir">Hapus Pesan terakhir</button>
    </div>
