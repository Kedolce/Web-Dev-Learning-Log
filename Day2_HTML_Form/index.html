<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form</title>
  </head>
  <body>
    <form action="">
      <label for="nama">Nama: </label>
      <input type="text" placeholder="nama anda..." id="nama" />
      <br /><br /><br />
      <label for="umur">Umur: </label>
      <input type="number" placeholder="umur anda..." id="umur" />
      <br /><br /><br />
      <label for="email">Email: </label>
      <input type="email" id="email" placeholder="email anda..." />
      <br /><br /><br />
      <label for="password">Password: </label>
      <input type="password" id="password" />
      <br /><br /><br />
      <label for="tl">Tanggal Lahir: </label>
      <input type="date" id="tl" placeholder="Tanggal Lahir..." />
      <br /><br /><br />
      <input type="radio" /> Laki <input type="radio" /> Perempuan

      <br /><br /><br />

      <input type="checkbox" /> HTML <input type="checkbox" /> CSS
      <input type="checkbox" /> JavaScript
      
      <br><br><br>

      <select name="level">
        <option value="beginner">beginner</option>
        <option value="intermediate">intermediate</option>
        <option value="advanced">advanced</option>
      </select>

      <br><br><br>

      <label for="alasan">Alasan kursus</label>
      <textarea name="alasanKursus" id=""></textarea>

      <br><br><br>
    </form>
  </body>
</html>
